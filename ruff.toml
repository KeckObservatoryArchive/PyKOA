# Ruff configuration for PyKOA
# https://docs.astral.sh/ruff/configuration/

# Excluded from all ruff checks:
# - tests/test_koa.py: entirely commented-out legacy test file
# - core.py (root): stray unpackaged 2022 copy of pykoa/koa/core.py
# - notebooks/: dev scratch, not part of the package
exclude = ["tests/test_koa.py", "core.py", "notebooks"]

[lint]
# Enforce pycodestyle errors/warnings (E/W) and pyflakes (F).
select = ["E", "F", "W"]

# Ignored:
# - E501 (line too long): core.py has many lines over 88 chars from the original
#   codebase. This is a ratchet — new code should stay under 88 chars, but fixing
#   all existing long lines is a separate task.
ignore = ["E501"]
